name: CI/CD RAG Types Enterprise

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  code-quality-and-security:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [
          "agentic RAG",
          "finops-gateway",
          "graph-rag",
          "hybrid-rag",
          "rag-evaluation"
        ]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f "${{ matrix.project }}/requirements.txt" ]; then pip install -r "${{ matrix.project }}/requirements.txt"; fi
        pip install ruff bandit mypy pytest

    - name: Lint with Ruff
      run: |
        ruff check "${{ matrix.project }}"

    - name: Type checking with Mypy
      run: |
        mypy --ignore-missing-imports "${{ matrix.project }}" || true

    - name: Security scan with Bandit
      run: |
        bandit -r "${{ matrix.project }}" -ll -ii

    - name: Run Pytest
      run: |
        cd "${{ matrix.project }}"
        pytest -v || true
